---
services:
  proxmox-preparer:
    build:
      context: .
      dockerfile: Dockerfile.preparer
    container_name: proxmox-preparer
    restart: "no"
    environment:
      ISO_FILE: proxmox.iso
      ANSWER_URL: http://192.168.1.2:8080/proxmox/9.2/default.toml
    volumes:
      - ./network-installer/assets/proxmox/9.2/:/srv/input/:ro
      - proxmox-pxe-assets:/srv/output

  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz
    container_name: netbootxyz
    environment:
      - MENU_VERSION=2.0.84 # optional
      - NGINX_PORT=80 # optional
      - WEB_APP_PORT=3000 # optional
    volumes:
      - netbootxyz-config:/config
      - ./network-installer/local-config/menus/autoexec.ipxe:/config/menus/autoexec.ipxe
      - ./network-installer/local-config/menus/custom.ipxe:/config/menus/custom.ipxe
      - ./network-installer/local-config/menus/local-vars.ipxe:/config/menus/local-vars.ipxe
      - ./network-installer/local-config/menus/menu.ipxe:/config/menus/menu.ipxe
      - ./network-installer/assets:/assets
      - proxmox-pxe-assets:/assets/proxmox/9.2/
      - ./network-installer/assets/proxmox/9.2/default.toml:/assets/proxmox/9.2/default.toml
    ports:
      - 3000:3000  # optional, destination should match ${WEB_APP_PORT} variable above.
      - 69:69/udp
      - 8080:80  # optional, destination should match ${NGINX_PORT} variable above.
    restart: unless-stopped
    depends_on:
      proxmox-preparer:
        condition: service_completed_successfully

  dnsmasq:
    image: alpine:latest
    container_name: dnsmasq-proxy
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      DNSMASQ_INTERFACE: "enp134s0"
      HOST_IP: "192.168.1.2"
      SUBNET_START: "192.168.1.100"
      SUBNET_END: "192.168.1.199"
    volumes:
      - ./network-installer/dnsmasq.conf:/etc/dnsmasq.conf.template:ro
    command: >
      sh -c "apk add --no-cache gettext dnsmasq &&
             envsubst '$${DNSMASQ_INTERFACE}$${SUBNET_START}$${SUBNET_END}$${HOST_IP}'  < /etc/dnsmasq.conf.template > /tmp/dnsmasq.conf &&
             dnsmasq --log-facility=-  -k --user=root -C /tmp/dnsmasq.conf"
    depends_on:
      - netbootxyz
    restart: unless-stopped

volumes:
  proxmox-pxe-assets:
  netbootxyz-config:
