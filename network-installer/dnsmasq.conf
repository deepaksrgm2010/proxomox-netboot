interface=${DNSMASQ_INTERFACE}

# Disable DNS — this instance is DHCP/TFTP only; avoids conflict with systemd-resolved on port 53
port=0

# dnsmasq will open tcp/udp port 53 and udp port 67 to world to help with dynamic interfaces (assigning dynamic IPs).
# dnsmasq will discard world requests to them, but the paranoid might like to close them and let the kernel handle them.
# You may also need this option if you have other instances of dnsmasq running (eg. because of libvirtd)
bind-interfaces

#dhcp-range=${DNSMASQ_PROXY_SUBNET},proxy
dhcp-range=${SUBNET_START},${SUBNET_END},12h

dhcp-no-override

# Match UEFI x86-64 clients (architecture ID 7 or 9).
# Without this, dnsmasq sends the same boot file to BIOS and UEFI clients,
# which breaks UEFI machines silently.
dhcp-match=set:efi-x86_64,option:client-arch,7
dhcp-match=set:efi-x86_64,option:client-arch,9

# Send grubx64.efi only to UEFI clients matched above.
# TFTP fetches this first; GRUB then takes over and fetches everything else via HTTP.
dhcp-boot=tag:efi-x86_64,netboot.xyz.efi,,${HOST_IP}

# Option 114: tell the Proxmox auto-installer where to fetch the answer file.
# SERVER_IP is substituted at runtime by entrypoint.sh via envsubst.


# enable-tftp
# tftp-root=/srv/tftp

# Verbose logging — essential for watching the boot sequence in real time
log-dhcp
log-queries
log-facility=-        # log to stdout so docker logs shows everything
